[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiida-qbox"
dynamic = ["version"]
description = "AiiDA plugin for the Qbox code (FPMD/DFT with hybrid functionals, client-server for WEST) — https://qboxcode.org"
authors = [{name = "Joseph Frimpong", email = "frimpsjoe@example.com"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Development Status :: 3 - Alpha",
    "Framework :: AiiDA",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
keywords = ["aiida", "qbox", "fpmd", "dft", "hybrid-functionals", "west", "client-server"]
requires-python = ">=3.9"
dependencies = [
    "aiida-core>=2.5,<3",
    "aiida-quantumespresso>=4.0",
    "pyyaml>=6.0",
    "voluptuous",
    "click",
    "lxml",
]

[project.optional-dependencies]
pre-commit = ["pre-commit~=3.5"]
testing = [
    "pgtest~=1.3,>=1.3.1",
    "coverage[toml]",
    "pytest~=7.0",
    "pytest-cov",
]
docs = [
    "sphinx",
    "sphinxcontrib-contentui",
    "sphinxcontrib-details-directive",
    "furo",
    "markupsafe<2.1",
]

[project.urls]
Source = "https://github.com/frimpsjoek/aiida-qbox"
Documentation = "https://aiida-qbox.readthedocs.io"

[project.scripts]
aiida-qbox = "aiida_qbox.cli:cmd_root"

[project.entry-points."aiida.calculations"]
"qbox.base" = "aiida_qbox.calculations.base:QboxBaseCalculation"
"qbox.server" = "aiida_qbox.calculations.server:QboxServerCalculation"

[project.entry-points."aiida.parsers"]
"qbox.base" = "aiida_qbox.parsers.base:QboxBaseParser"
"qbox.server" = "aiida_qbox.parsers.server:QboxServerParser"

[project.entry-points."aiida.workflows"]
"qbox.base" = "aiida_qbox.workchains.base:QboxBaseWorkChain"
"qbox.relax" = "aiida_qbox.workchains.relax:QboxRelaxWorkChain"
"qbox.md" = "aiida_qbox.workchains.md:QboxMDWorkChain"
"qbox.server" = "aiida_qbox.workchains.server:QboxServerWorkChain"

[tool.hatch.version]
path = "src/aiida_qbox/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aiida_qbox"]

[tool.hatch.build.targets.sdist]
include = [
    "src/aiida_qbox",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
python_files = "test_*.py example_*.py"
filterwarnings = [
    "ignore::DeprecationWarning:aiida:",
    "ignore:Creating AiiDA configuration folder:",
    "ignore::DeprecationWarning:plumpy:",
    "ignore::DeprecationWarning:yaml:",
]

[tool.coverage.run]
source = ["src/aiida_qbox"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "F403", "F405",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "RUF005", "RUF012",
]
select = ["E", "W", "F", "I", "N", "PLC", "PLE", "PLR", "PLW", "RUF"]

[tool.hatch.envs.hatch-test]
dependencies = [
    "pgtest~=1.3,>=1.3.1",
    "coverage~=7.0",
    "pytest~=7.0",
    "pytest-cov~=4.1",
]

[tool.hatch.envs.hatch-test.scripts]
run = "pytest{env:HATCH_TEST_ARGS:} {args}"
run-cov = "coverage run -m pytest{env:HATCH_TEST_ARGS:} {args}"
cov-combine = "coverage combine"
cov-report = "coverage report"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.9", "3.10", "3.11", "3.12"]

[tool.hatch.envs.hatch-static-analysis]
dependencies = ["ruff==0.4.3"]

[tool.hatch.envs.hatch-static-analysis.scripts]
format-check = "ruff format --check --config pyproject.toml {args:.}"
format-fix = "ruff format --config pyproject.toml {args:.}"
lint-check = "ruff check --config pyproject.toml {args:.}"
lint-fix = "ruff check --config pyproject.toml --fix --exit-non-zero-on-fix --show-fixes {args:.}"

[tool.hatch.envs.docs]
features = ["docs"]

[tool.hatch.envs.docs.scripts]
build = ["make -C docs"]