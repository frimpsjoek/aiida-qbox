# Qbox HSE06 geometry relaxation protocol
description: "Geometry optimization with HSE06"
parameters:
  set ecut: "40"
  set xc: "HSE"
  set wf_dyn: "PSDA"
  set scf_tol: "1e-8"
  set max_scf: "150"
  set muRSH: "0.2"
  set alphaRSH: "0.25"
  set betaRSH: "0.0"
  set blHF: "3 3 3"
  set btHF: "0.01"
  set atoms_dyn: "CG"
  set dt: "10"
  randomize_wf: ""
  run: "0 150"