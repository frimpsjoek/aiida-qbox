# Qbox cell shape/volume relaxation (variable cell CG)
description: "Cell shape/volume relaxation (variable cell CG)"
parameters:
  set ecut: "30"
  set xc: "PBE"
  set wf_dyn: "PSDA"
  set scf_tol: "1e-8"
  set max_scf: "100"
  set atoms_dyn: "CG"
  set cell_dyn: "CG"
  set dt: "10"
  set stress: "ON"
  randomize_wf: ""
  run: "0 100"